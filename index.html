<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Visitas — Astra & Japi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #F0F4F8;
  --surface: #FFFFFF;
  --border: rgba(0,124,194,0.10);
  --text: #16202E;
  --muted: #6B7A8F;
  --accent: #007CC2;
  --accent-light: #E6F3FC;
  --accent-dark: #005A8C;
  --red: #C62828;
  --red-light: #FDECEC;
  --amber: #C97A00;
  --amber-light: #FFF6E5;
  --green: #1E8E5A;
  --green-light: #E9FAF1;
  --gray-light: #EEF0F3;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(0,124,194,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: #fff; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 16px rgba(0,124,194,0.25);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo svg { height: 32px; width: auto; }
.header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.header-sub { font-size: 11px; opacity: 0.8; font-weight: 400; margin-top: 1px; }
.btn-icon {
  background: rgba(255,255,255,0.15); border: none; color: #fff; width: 36px; height: 36px;
  border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ===== SEARCH & FILTERS ===== */
.search-bar {
  display: flex; gap: 8px; padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 64px; z-index: 99;
}
.search-bar input {
  flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 12px; font-size: 14px; outline: none; background: var(--bg);
}
.search-bar select {
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 4px; font-size: 12px; background: var(--bg); outline: none; max-width: 100px;
}

/* ===== CHIPS ===== */
.urg-chips { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
.urg-chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  white-space: nowrap; border: none; cursor: pointer; background: var(--gray-light); color: var(--muted);
}
.chip.active { background: var(--accent); color: #fff; }
.chip-red.active { background: var(--red); color: #fff; }
.chip-amber.active { background: var(--amber); color: #fff; }
.chip-green.active { background: var(--green); color: #fff; }

/* ===== LISTA ===== */
.list-wrap { padding: 0 16px; }
.card {
  background: var(--surface); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border);
  cursor: pointer; transition: transform 0.2s;
}
.card:active { transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-name { font-size: 15px; font-weight: 700; color: var(--text); }
.badge { font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
.badge-astra { background: var(--red); color: #fff; }
.badge-japi { background: var(--accent); color: #fff; }
.card-info { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.card-contact { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; font-style: italic; }

/* ===== DASHBOARD ===== */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
.dash-card {
  background: var(--surface); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center;
}
.dash-num { font-size: 24px; font-weight: 800; color: var(--accent); }
.dash-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.dash-section { padding: 0 16px 20px; }
.dash-section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.dash-list-item {
  background: #fff; padding: 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 13px;
}

/* ===== DRAWERS & MODALS ===== */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
  border-radius: 20px 20px 0 0; z-index: 210; padding: 20px;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 90vh; overflow-y: auto;
}
.drawer.open { transform: translateY(0); }
.drawer-handle { width: 40px; height: 5px; background: #ddd; border-radius: 10px; margin: 0 auto 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none;
}
.radio-group { display: flex; gap: 20px; padding: 5px 0; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff; border: none; width: 100%; padding: 14px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
}

/* ===== TAB BAR ===== */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
  display: flex; border-top: 1px solid var(--border); z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
  flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 600;
  color: var(--muted); cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.tab-item.active { color: var(--accent); }
.tab-icon { font-size: 20px; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #16202E; color: #fff; padding: 10px 20px; border-radius: 30px;
  font-size: 13px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 100 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="4" width="96" height="24" rx="12" fill="#C62828"/>
        <rect x="2" y="4" width="96" height="24" rx="12" stroke="white" stroke-width="1.5"/>
        <text x="50" y="21" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="14" letter-spacing="1">astra</text>
      </svg>
    </div>
    <div>
      <div class="header-title">Controle de Visitas</div>
      <div class="header-sub">Astra & Japi</div>
    </div>
  </div>
  <button class="btn-icon" onclick="toggleConfig()">⚙️</button>
</div>

<div id="view-lista">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 Buscar cliente..." oninput="renderLista()">
    <select id="filterOrigem" onchange="renderLista()">
      <option value="all">Origem</option>
      <option value="Astra">Astra</option>
      <option value="Japi">Japi</option>
    </select>
    <select id="sortOrder" onchange="renderLista()">
      <option value="urgencia">Urgência</option>
      <option value="nome">Nome A-Z</option>
      <option value="compra">Compra</option>
    </select>
  </div>

  <div class="urg-chips" id="urgChips"></div>
  <div class="list-wrap" id="clientList"></div>
</div>

<div id="view-dashboard" style="display:none">
  <div class="dash-grid" id="dashKpis"></div>
  <div id="dashDetails" style="padding: 0 16px 16px"></div>
  
  <div class="dash-section">
    <div class="dash-section-title">🔴 Sem visita +60 dias</div>
    <div id="listCriticos"></div>
  </div>
  
  <div class="dash-section">
    <div class="dash-section-title">⚠️ Compra recente s/ visita</div>
    <div id="listAtencao"></div>
  </div>
</div>

<!-- DRAWERS -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeAllDrawers()"></div>

<div class="drawer" id="drawerNovo">
  <div class="drawer-handle"></div>
  <h3 style="margin-bottom:20px">Novo Cliente</h3>
  <div class="form-group">
    <label>NOME DO CLIENTE *</label>
    <input type="text" id="novoNome">
  </div>
  <div class="form-group">
    <label>CNPJ</label>
    <input type="text" id="novoCnpj">
  </div>
  <div class="form-group">
    <label>CONTATO</label>
    <input type="text" id="novoContato">
  </div>
  <div class="form-group">
    <label>ÚLTIMA COMPRA</label>
    <input type="date" id="novoCompra">
  </div>
  <div class="form-group">
    <label>ORIGEM</label>
    <div class="radio-group">
      <label><input type="radio" name="novoOrigem" value="Astra" checked> Astra</label>
      <label><input type="radio" name="novoOrigem" value="Japi"> Japi</label>
    </div>
  </div>
  <button class="btn-primary" onclick="salvarNovo()">Salvar cliente</button>
</div>

<div class="drawer" id="drawerEdit">
  <div class="drawer-handle"></div>
  <h3 style="margin-bottom:20px">Editar Cliente</h3>
  <input type="hidden" id="editId">
  <div class="form-group">
    <label>NOME DO CLIENTE</label>
    <input type="text" id="editNome">
  </div>
  <div class="form-group">
    <label>ÚLTIMA COMPRA</label>
    <input type="date" id="editCompra">
  </div>
  <div class="form-group">
    <label>VISITAS REALIZADAS</label>
    <div id="editVisitasLista" style="margin-bottom:10px"></div>
    <div style="display:flex; gap:8px">
      <input type="date" id="novaVisitaData" style="flex:1">
      <button class="btn-primary" style="width:50px; margin:0" onclick="addVisita()">+</button>
    </div>
  </div>
  <button class="btn-primary" onclick="salvarEdicao()">Salvar Alterações</button>
  <button class="btn-primary" style="background:none; color:var(--red); border:1px solid var(--red); margin-top:10px" onclick="excluirCliente()">Excluir Cliente</button>
</div>

<div class="drawer" id="modalConfig">
  <div class="drawer-handle"></div>
  <h3>Sincronização</h3>
  <p style="font-size:13px; color:var(--muted); margin:15px 0">Conecte com seu Google Sheets para manter os dados salvos na nuvem.</p>
  <button class="btn-primary" onclick="sincronizarAgora()">⇅ Sincronizar agora</button>
  <button class="btn-primary" style="background:var(--gray-light); color:var(--text); margin-top:10px" onclick="exportarXLSX()">📥 Exportar Excel</button>
</div>

<div class="tab-bar">
  <div class="tab-item active" id="tab-lista" onclick="showView('lista')">
    <span class="tab-icon">📋</span><span>Lista</span>
  </div>
  <div class="tab-item" id="tab-dash" onclick="showView('dashboard')">
    <span class="tab-icon">📊</span><span>Dashboard</span>
  </div>
  <div class="tab-item" onclick="openNovoDrawer()">
    <span class="tab-icon">➕</span><span>Novo</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRWczQWpigTbj9SdOTPAKzfb30OWScWUxarmBHmd4k5PaORkTyAnA2QUT_K-ojpRxP/exec';
let clientes = [];
let currentChip = 'all';
let expandedKpi = null;

// --- DATA MGMT ---
function loadClientes() {
  const saved = localStorage.getItem('astraJapiClientes');
  clientes = saved ? JSON.parse(saved) : [];
}

function saveClientes() {
  localStorage.setItem('astraJapiClientes', JSON.stringify(clientes));
}

// --- UTILS ---
function todayISO() { return new Date().toISOString().split('T')[0]; }
function diffDays(d) {
  if(!d) return null;
  const diff = new Date() - new Date(d);
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}
function fmtDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }

function urgenciaInfo(c) {
  const d = diffDays(c.ultimaVisita);
  if (d === null) return { label: 'Nunca visitado', cls: 'chip-amber' };
  if (d > 60) return { label: `${d}d sem visita`, cls: 'chip-red' };
  if (d > 30) return { label: `${d}d sem visita`, cls: 'chip-amber' };
  return { label: `${d}d atrás`, cls: 'chip-green' };
}

// --- RENDERERS ---
function renderUrgChips() {
  const total = clientes.length;
  const criticos = clientes.filter(c => { const d = diffDays(c.ultimaVisita); return d === null || d > 60; }).length;
  const nunca = clientes.filter(c => !c.ultimaVisita).length;
  const ok = total - criticos;

  const html = `
    <button class="chip ${currentChip==='all'?'active':''}" onclick="setChip('all')">Todos (${total})</button>
    <button class="chip chip-red ${currentChip==='critico'?'active':''}" onclick="setChip('critico')">🔴 ${criticos} críticos</button>
    <button class="chip chip-amber ${currentChip==='nunca'?'active':''}" onclick="setChip('nunca')">🟡 ${nunca} nunca</button>
    <button class="chip chip-green ${currentChip==='ok'?'active':''}" onclick="setChip('ok')">🟢 ${ok} ok</button>
  `;
  document.getElementById('urgChips').innerHTML = html;
}

function setChip(c) { currentChip = c; renderUrgChips(); renderLista(); }

function renderLista() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const origem = document.getElementById('filterOrigem').value;
  const sort = document.getElementById('sortOrder').value;

  let filtered = clientes.filter(c => {
    const matchSearch = c.nome.toLowerCase().includes(search);
    const matchOrigem = origem === 'all' || c.origem === origem;
    let matchChip = true;
    const d = diffDays(c.ultimaVisita);
    if(currentChip === 'critico') matchChip = (d === null || d > 60);
    if(currentChip === 'nunca') matchChip = (d === null);
    if(currentChip === 'ok') matchChip = (d !== null && d &lt;= 60);
    return matchSearch && matchOrigem && matchChip;
  });

  filtered.sort((a, b) => {
    if(sort === 'nome') return a.nome.localeCompare(b.nome);
    if(sort === 'compra') return (b.ultimaCompra || '') > (a.ultimaCompra || '') ? 1 : -1;
    const da = diffDays(a.ultimaVisita) ?? 999;
    const db = diffDays(b.ultimaVisita) ?? 999;
    return db - da;
  });

  const wrap = document.getElementById('clientList');
  wrap.innerHTML = filtered.map(c => {
    const info = urgenciaInfo(c);
    return `
      <div class="card" onclick="openEditDrawer('${c.id}')">
        <div class="card-header">
          <div class="card-name">${c.nome}</div>
          <span class="badge badge-${c.origem.toLowerCase()}">${c.origem}</span>
        </div>
        <div class="card-info">
          <span style="color:${info.cls==='chip-red'?'var(--red)':'var(--muted)'}; font-weight:600">${info.label}</span>
          <span>Última compra: ${fmtDate(c.ultimaCompra)}</span>
        </div>
        ${c.contato ? `<div class="card-contact">📞 ${c.contato}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderDashboard() {
  const total = clientes.length;
  const criticos = clientes.filter(c => { const d = diffDays(c.ultimaVisita); return d === null || d > 60; });
  const nunca = clientes.filter(c => !c.ultimaVisita);
  const v30 = clientes.filter(c => c.visitas?.some(v => diffDays(v) &lt;= 30));

  const kpis = [
    { id: 'total', label: 'Ativos', val: total, list: clientes },
    { id: 'crit', label: 'Críticos', val: criticos.length, list: criticos },
    { id: 'nunca', label: 'Nunca', val: nunca.length, list: nunca },
    { id: 'v30', label: 'Visitas 30d', val: v30.length, list: v30 }
  ];

  document.getElementById('dashKpis').innerHTML = kpis.map(k => `
    <div class="dash-card" onclick="toggleKpiDetail('${k.id}')">
      <div class="dash-num">${k.val}</div>
      <div class="dash-label">${k.label}</div>
    </div>
  `).join('');

  if(expandedKpi) {
    const k = kpis.find(x => x.id === expandedKpi);
    document.getElementById('dashDetails').innerHTML = `
      <div style="background:#fff; padding:15px; border-radius:14px; border:1px solid var(--border)">
        <div style="font-weight:700; margin-bottom:10px; font-size:13px">${k.label.toUpperCase()}</div>
        ${k.list.slice(0,10).map(i => `<div style="font-size:12px; padding:6px 0; border-bottom:1px solid #f0f0f0">${i.nome}</div>`).join('')}
      </div>
    `;
  } else {
    document.getElementById('dashDetails').innerHTML = '';
  }

  document.getElementById('listCriticos').innerHTML = criticos.slice(0,5).map(c => `
    <div class="dash-list-item" onclick="openEditDrawer('${c.id}')">
      <span>${c.nome}</span>
      <span style="color:var(--red); font-weight:700">${diffDays(c.ultimaVisita) ?? '∞'}d</span>
    </div>
  `).join('');

  const atencao = clientes.filter(c => diffDays(c.ultimaCompra) &lt;= 45 && (diffDays(c.ultimaVisita) > 30 || !c.ultimaVisita));
  document.getElementById('listAtencao').innerHTML = atencao.slice(0,5).map(c => `
    <div class="dash-list-item" onclick="openEditDrawer('${c.id}')">
      <span>${c.nome}</span>
      <span style="color:var(--amber)">⚠️</span>
    </div>
  `).join('');
}

function toggleKpiDetail(id) {
  expandedKpi = expandedKpi === id ? null : id;
  renderDashboard();
}

// --- ACTIONS ---
function showView(v) {
  document.getElementById('view-lista').style.display = v === 'lista' ? 'block' : 'none';
  document.getElementById('view-dashboard').style.display = v === 'dashboard' ? 'block' : 'none';
  document.getElementById('tab-lista').classList.toggle('active', v === 'lista');
  document.getElementById('tab-dash').classList.toggle('active', v === 'dashboard');
  if(v === 'dashboard') renderDashboard();
}

function openNovoDrawer() {
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerNovo').classList.add('open');
}

function openEditDrawer(id) {
  const c = clientes.find(x => x.id === id);
  document.getElementById('editId').value = c.id;
  document.getElementById('editNome').value = c.nome;
  document.getElementById('editCompra').value = c.ultimaCompra || '';
  renderVisitasEdit(c);
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerEdit').classList.add('open');
}

function renderVisitasEdit(c) {
  const list = c.visitas || [];
  document.getElementById('editVisitasLista').innerHTML = list.sort().reverse().map(v => `
    <div style="display:flex; justify-content:space-between; padding:8px; background:var(--bg); border-radius:6px; margin-bottom:4px; font-size:13px">
      <span>${fmtDate(v)}</span>
      <span style="color:var(--red)" onclick="removerVisita('${v}')">Remover</span>
    </div>
  `).join('');
}

function closeAllDrawers() {
  document.querySelectorAll('.drawer, .drawer-overlay').forEach(el => el.classList.remove('open'));
}

function salvarNovo() {
  const nome = document.getElementById('novoNome').value;
  if(!nome) return showToast('Nome é obrigatório');
  const novo = {
    id: Date.now().toString(),
    nome,
    cnpj: document.getElementById('novoCnpj').value,
    contato: document.getElementById('novoContato').value,
    ultimaCompra: document.getElementById('novoCompra').value,
    origem: document.querySelector('input[name="novoOrigem"]:checked').value,
    visitas: [],
    ultimaVisita: null
  };
  clientes.push(novo);
  saveClientes();
  closeAllDrawers();
  renderLista();
  showToast('Cliente salvo!');
}

function salvarEdicao() {
  const id = document.getElementById('editId').value;
  const idx = clientes.findIndex(x => x.id === id);
  clientes[idx].nome = document.getElementById('editNome').value;
  clientes[idx].ultimaCompra = document.getElementById('editCompra').value;
  saveClientes();
  closeAllDrawers();
  renderLista();
  showToast('Atualizado!');
}

function addVisita() {
  const id = document.getElementById('editId').value;
  const data = document.getElementById('novaVisitaData').value;
  if(!data) return;
  const idx = clientes.findIndex(x => x.id === id);
  if(!clientes[idx].visitas) clientes[idx].visitas = [];
  clientes[idx].visitas.push(data);
  clientes[idx].ultimaVisita = clientes[idx].visitas.sort().reverse()[0];
  saveClientes();
  renderVisitasEdit(clientes[idx]);
  document.getElementById('novaVisitaData').value = '';
}

function removerVisita(data) {
  const id = document.getElementById('editId').value;
  const idx = clientes.findIndex(x => x.id === id);
  clientes[idx].visitas = clientes[idx].visitas.filter(v => v !== data);
  clientes[idx].ultimaVisita = clientes[idx].visitas.sort().reverse()[0] || null;
  saveClientes();
  renderVisitasEdit(clientes[idx]);
}

function excluirCliente() {
  if(!confirm('Excluir permanentemente?')) return;
  const id = document.getElementById('editId').value;
  clientes = clientes.filter(x => x.id !== id);
  saveClientes();
  closeAllDrawers();
  renderLista();
}

function toggleConfig() {
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('modalConfig').classList.add('open');
}

async function sincronizarAgora() {
  showToast('Sincronizando...');
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(clientes)
    });
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if(data && data.length > 0) {
      clientes = data;
      saveClientes();
      renderLista();
      showToast('Sincronizado com sucesso!');
    }
  } catch(e) {
    showToast('Erro ao sincronizar');
  }
}

function exportarXLSX() {
  const ws = XLSX.utils.json_to_sheet(clientes.map(c => ({
    Nome: c.nome,
    Origem: c.origem,
    CNPJ: c.cnpj,
    Contato: c.contato,
    UltimaCompra: c.ultimaCompra,
    UltimaVisita: c.ultimaVisita
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Visitas");
  XLSX.writeFile(wb, `Visitas_AstraJapi_${todayISO()}.xlsx`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- INIT ---
loadClientes();
renderUrgChips();
renderLista();
</script>
</body>
